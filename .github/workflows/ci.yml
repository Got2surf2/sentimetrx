name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Manual re-run. On 2026-08-26 a push to main landed (ba1773f4..93dbdf34) and
  # GitHub created NO workflow run for it — Actions enabled, no path filters,
  # same credentials as the push before it, which ran fine. Because the Vercel
  # deploy hook is fired by this workflow, "CI didn't run" silently means
  # "production didn't deploy", and without a dispatch trigger there was no way
  # to recover except pushing another commit.
  workflow_dispatch:

jobs:
  test:
    name: typecheck + tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Supabase env vars are required by lib/supabase/server at module-load
      # time. The values are placeholders — every test mocks the supabase
      # client at the boundary, so no real network call is made.
      NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
      SUPABASE_SERVICE_ROLE_KEY: test-service-role-key
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: SQL migration tx-wrap guard
        run: npm run check:sql-tx

      - name: No legacy dataset_rows reads
        run: npm run check:no-legacy-rows

      - name: Lint (warn-only ratchet)
        # eslint 9 flat config. 0 errors today; ~3870 warnings over the existing
        # backlog. --max-warnings 3900 = a small headroom ceiling so this is
        # green today and FAILS only if new code pushes the warning count up.
        # Ratchet the number DOWN in eslint.config.mjs's script as warnings are
        # burned off (same pattern as the coverage floor). See ENGINEERING §1.
        run: npm run lint:ci

      - name: Unit + integration tests (with coverage gate)
        run: npm run test:coverage

  isolation:
    name: multi-tenant isolation (RLS + egress)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Real Supabase creds — the isolation suites hit a live Postgres to prove
      # RLS actually filters cross-org. Pre-launch these hold the prod project's
      # values (suites namespace + clean up their own `_rlstest_*` data); once a
      # dedicated test project exists, repoint these secrets there (one place).
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_TEST_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_TEST_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_TEST_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # The suites use `describe.skip` when creds are missing/placeholder and
      # vitest still exits 0 — so without this guard a green check would mean
      # "isolation was never tested," the exact gap this job closes. Fail loud
      # instead: this job stays RED until the SUPABASE_TEST_* secrets are set.
      - name: Preflight — require real Supabase creds (else the suites silently skip)
        run: |
          if [ -z "$NEXT_PUBLIC_SUPABASE_URL" ] || [ -z "$NEXT_PUBLIC_SUPABASE_ANON_KEY" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::Isolation suites need SUPABASE_TEST_URL / SUPABASE_TEST_ANON_KEY / SUPABASE_TEST_SERVICE_ROLE_KEY repo secrets. Without them the RLS/egress tests self-skip and this check would pass without testing tenant isolation."
            exit 1
          fi
          if [ "$NEXT_PUBLIC_SUPABASE_URL" = "http://localhost:54321" ] || [ "$SUPABASE_SERVICE_ROLE_KEY" = "test-service-role-key" ]; then
            echo "::error::Placeholder Supabase creds detected — isolation suites would skip. Set real SUPABASE_TEST_* secrets."
            exit 1
          fi

      - name: RLS isolation (every public table has a filtering policy)
        run: npm run test:rls

      - name: Cross-org egress (org B cannot read org A)
        run: npm run test:egress

      - name: Auth-flow round-trips
        run: npm run test:auth-flows

      - name: Campaign route egress
        run: npm run test:campaign-egress

      - name: Dataset route egress
        run: npm run test:dataset-egress


  e2e:
    name: e2e smoke (real browser vs production build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_TEST_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_TEST_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_TEST_SERVICE_ROLE_KEY }}
      E2E_BASE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Same fail-loud contract as the isolation job: the smoke suite
      # self-skips without real creds, and a green-but-skipped check would
      # mean "the browser flow was never exercised".
      - name: Preflight — require real Supabase creds (else the suite silently skips)
        run: |
          if [ -z "$NEXT_PUBLIC_SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::e2e smoke needs SUPABASE_TEST_* repo secrets — without them the suite self-skips and this check would pass without testing anything."
            exit 1
          fi

      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium

      # Production build — dev-mode compile-on-visit is too slow/flaky for CI.
      # playwright.config.ts serves it via `npm run start` when CI is set.
      - name: Build
        run: npm run build

      - name: e2e smoke suite
        run: npx playwright test tests/e2e/smoke.spec.ts

  deploy:
    name: production deploy (after green)
    # Deploy-behind-CI (2026-07-04): pushes to main no longer auto-deploy —
    # vercel.json sets git.deploymentEnabled main:false, and THIS job fires
    # the Vercel deploy hook only when every check above is green, so a
    # broken build can never race CI into production. Docs-only pushes skip
    # the deploy, evaluated over the FULL push range (the retired
    # ignored-build-step check diffed HEAD^..HEAD only, so a multi-commit
    # push ending in a docs commit would have silently skipped deploying
    # its code). Manual fallback if the hook path is ever broken:
    # `vercel deploy --prod` from an authorized laptop.
    needs: [test, isolation, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: deploy-main
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gate — skip docs-only pushes (full push range)
        id: gate
        run: |
          BEFORE="${{ github.event.before }}"
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "push range unknown → deploy"
            echo "deploy=yes" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$BEFORE" HEAD -- . ':(exclude)docs'; then
            echo "docs-only push → no deploy needed"
            echo "deploy=no" >> "$GITHUB_OUTPUT"
          else
            echo "code changed → deploy"
            echo "deploy=yes" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger Vercel production build
        if: steps.gate.outputs.deploy == 'yes'
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK_MAIN }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::error::VERCEL_DEPLOY_HOOK_MAIN secret is not set — create a main-branch deploy hook (Vercel → Settings → Git → Deploy Hooks) and add it: gh secret set VERCEL_DEPLOY_HOOK_MAIN"
            exit 1
          fi
          curl -sf -X POST "$HOOK"
          echo ""
          echo "Deploy hook fired — Vercel is building the current HEAD of main."
