# CodeQL — SECURITY.md §9 / open item 2, the static-analysis half. The repo is
# public, so GitHub code scanning is free. Findings land in Security → Code
# scanning and annotate PRs against main.
#
# The first-run backlog was triaged to 0 open alerts, and "CodeQL" has been a
# REQUIRED status check on main since 2026-09-21 (branch protection) — a PR
# that introduces an alert cannot merge. The production deploy itself is still
# gated by ci.yml's `deploy` job. The weekly governance routine reads the
# open-alert count (.claude/commands/audit-codebase.md, Security band).
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Monday 06:00 UTC = 02:00 ET — picks up newly published queries against an
    # unchanged main, and finishes before the 04:00 ET governance run.
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # `actions` scans the workflow files themselves (expression injection,
        # untrusted checkout) — cheap, and ci.yml is part of the deploy path.
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          # Tests carry fixture credentials and deliberately hostile inputs —
          # noise, not findings. scripts/oneoff are one-shot local tools.
          # prototype/ is static design prototypes (CDN scripts, Math.random
          # ids) that never ship — 8 of the first run's 70 alerts were there.
          config: |
            paths-ignore:
              - tests
              - scripts/oneoff
              - prototype
              - '**/*.test.ts'
              - '**/*.test.tsx'
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
