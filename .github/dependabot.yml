# Dependabot — SECURITY.md §9 / open item 2, the "weekly" half (the npm-audit
# half is scripts/audit-gate.ts, which runs on every push). Scheduled Monday
# 02:00 ET so any PRs are already open when the 04:00 ET weekly governance
# routine reads the repo.
#
# Cost rules this file encodes (CLAUDE.md push policy — zero builds nobody
# asked for):
#   - PRs are GROUPED: a normal week is at most two npm PRs (production /
#     development minor+patch) plus one per semver-major that isn't ignored.
#   - Preview builds for dependabot/** branches are OFF in vercel.json
#     (`git.deploymentEnabled`), so a Dependabot PR costs CI minutes only
#     (public repo: free), never a Vercel build.
#   - NOTHING auto-merges. A merge to main is a production release
#     (deploy-behind-CI) and stays a human action, like every other push.
#   - 7-day cooldown: a version must be a week old before we take it, so a
#     compromised release (the supply-chain threat in SECURITY.md §2) is
#     usually pulled upstream before it can reach a PR here.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "02:00"
      timezone: America/New_York
    open-pull-requests-limit: 5
    versioning-strategy: increase
    cooldown:
      default-days: 7
    commit-message:
      prefix: deps
      prefix-development: deps(dev)
    groups:
      prod-minor-patch:
        dependency-type: production
        update-types: [minor, patch]
      dev-minor-patch:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # jsdom is held at 26 and isomorphic-dompurify at 2.x (3.x needs jsdom 27)
      # — a deliberate pin from the Next 16 upgrade, see ENGINEERING.md. A
      # major here is a planned change, not a Monday PR.
      - dependency-name: jsdom
        update-types: [version-update:semver-major]
      - dependency-name: isomorphic-dompurify
        update-types: [version-update:semver-major]
      # ...and its MINORS move jsdom too: 2.28 → jsdom 27, 2.36 → jsdom 28
      # (the 2026-09 prod group PR carried 2.36 and would have un-pinned jsdom
      # with green CI). 2.26.0 is the last release on jsdom 26, so hold it
      # exactly until the jsdom upgrade is done as its own project.
      - dependency-name: isomorphic-dompurify
        versions: [">2.26.0"]
      # puppeteer-core drives the Chromium build that @sparticuz/chromium ships
      # to Vercel; each puppeteer release targets one Chrome version (25.10 →
      # Chrome 152, we ship Chromium 149). They move TOGETHER, by hand, with a
      # production PDF export checked afterwards — five report routes 500 if
      # the pair or its file tracing is wrong (ENGINEERING.md).
      - dependency-name: puppeteer-core
      - dependency-name: "@sparticuz/chromium"
      # Framework majors are upgrade PROJECTS (Next 16 took its own week with a
      # --webpack opt-out and a middleware→proxy rename), never a bot PR.
      - dependency-name: next
        update-types: [version-update:semver-major]
      - dependency-name: react
        update-types: [version-update:semver-major]
      - dependency-name: react-dom
        update-types: [version-update:semver-major]
      # Tailwind 4 replaces tailwind.config.js + the PostCSS plugin with a
      # CSS-first config — the bot PR (#42) failed the e2e smoke job.
      # Every screen needs a visual pass, so it is a project, not a bump.
      - dependency-name: tailwindcss
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "02:00"
      timezone: America/New_York
    groups:
      actions:
        patterns: ["*"]
